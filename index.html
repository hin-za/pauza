<!DOCTYPE html>
<html lang="cs">

<title>Pauza</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #151c28;
    --border: #26334d;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #10b981;
    --accent-dim: rgba(16, 185, 129, 0.15);
    --blue: #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem; }
  
  .wrapper { max-width: 520px; width: 100%; }

  /* Hlavní záchranná karta (Fáze 1) */
  .main-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem 1.75rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  
  .status-pill { display: inline-block; background: var(--accent-dim); color: var(--accent); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.3rem 0.75rem; border-radius: 99px; margin-bottom: 1rem; border: 1px solid rgba(16, 185, 129, 0.3); }
  
  h1 { font-size: 1.45rem; color: #fff; margin-bottom: 0.5rem; font-weight: 700; }
  .subtitle { font-size: 0.95rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.5rem; }

  /* Kombinovaný dechový kruh a časovač */
  .visualizer { position: relative; width: 170px; height: 170px; margin: 0 auto 1.25rem auto; display: flex; align-items: center; justify-content: center; }
  .breath-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.28) 0%, rgba(16,185,129,0.03) 70%); border: 2px solid var(--accent); transition: transform 4s ease-in-out, border-color 1s; }
  .breath-ring.inhale { transform: scale(1.18); border-color: var(--blue); transition-duration: 4s; }
  .breath-ring.exhale { transform: scale(0.82); border-color: var(--accent); transition-duration: 6s; }
  
  .center-data { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .timer { font-size: 2.3rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; line-height: 1.1; }
  .breath-guide { font-size: 0.85rem; font-weight: 600; color: var(--accent); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

  .xhalr-link { display: inline-block; font-size: 0.82rem; color: var(--blue); text-decoration: none; margin-bottom: 1.5rem; opacity: 0.85; }
  .xhalr-link:hover { opacity: 1; text-decoration: underline; }

  /* Interaktivní akční kroky (Zaměstnání rukou a pozornosti) */
  .checklist { text-align: left; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.25rem; }
  .check-item { display: flex; align-items: center; gap: 0.85rem; background: #1c2536; border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 10px; cursor: pointer; transition: all 0.2s; user-select: none; }
  .check-item:hover { border-color: #3b4d71; }
  .check-item.done { background: rgba(16, 185, 129, 0.08); border-color: var(--accent); color: var(--muted); text-decoration: line-through; }
  .check-box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.8rem; color: transparent; transition: all 0.2s; }
  .check-item.done .check-box { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold; }
  .check-text { font-size: 0.92rem; line-height: 1.35; }

  /* Tlačítko pro otevření Fáze 2 */
  .toggle-science { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 100%; padding: 0.75rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .toggle-science:hover { color: #fff; border-color: var(--muted); background: rgba(255,255,255,0.03); }

  /* Fáze 2: Skrytá vědecká fakta (načtou se až na vyžádání) */
  .science-panel { display: none; margin-top: 1rem; text-align: left; }
  .science-panel.visible { display: block; }
